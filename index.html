<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi des congés</title>
  <meta name="description" content="Suivi personnel des congés, RTT, télétravail et astreintes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='23' rx='4' fill='%233b82c4'/%3E%3Crect x='3' y='6' width='26' height='7' rx='3' fill='%232563a0'/%3E%3Crect x='9' y='3' width='3' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='20' y='3' width='3' height='6' rx='1.5' fill='%23fff'/%3E%3Cpath d='M10 20l4 4 8-8' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Suivi des congés</h1>
    <div class="year-nav" role="group" aria-label="Année">
      <button type="button" id="prev-year" class="icon-btn" aria-label="Année précédente">‹</button>
      <select id="year-select" aria-label="Année"></select>
      <button type="button" id="next-year" class="icon-btn" aria-label="Année suivante">›</button>
    </div>
    <button type="button" id="today-btn" class="btn">Aujourd’hui</button>
    <span class="spacer"></span>
    <button type="button" id="undo-btn" class="btn" title="Annuler (Ctrl+Z)" disabled>Annuler</button>
    <button type="button" id="settings-btn" class="btn">Réglages</button>
    <button type="button" id="data-btn" class="btn">Données</button>
  </header>

  <div class="palette-bar" id="palette" role="toolbar" aria-label="Pinceau : choisissez un type puis cliquez sur les jours"></div>

  <main class="layout">
    <aside class="summary" id="summary" aria-live="polite"></aside>
    <section class="calendar-wrap" aria-label="Calendrier annuel">
      <div class="calendar-scroll" id="calendar-scroll"><div class="calendar" id="calendar"></div></div>
      <p class="legend" id="legend"></p>
    </section>
  </main>

  <dialog id="settings-dialog"><form method="dialog" class="dialog-body" id="settings-body"></form></dialog>
  <dialog id="data-dialog"><form method="dialog" class="dialog-body" id="data-body"></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/lib.js"></script>
  <script src="data/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
